# gswitch-auto user settings (~/.config/gswitch/auto.conf).
#
# Written by gswitch-tray (Settings -> Auto correction); hand edits are picked
# up by the daemon automatically. Format: key=value, one per line; lines
# starting with '#' are comments. Every key is listed below, commented out,
# with its default value. Keys of /etc/gswitch/default.conf (layout-switch,
# convert-key, delay, ...) do not belong here and are ignored.

# Automatic correction of the last word on Space. Toggled with the chord
# below and from the tray menu.
# auto-enabled=false

# Shortest and longest word (in keys) that is corrected automatically.
# auto-min-letters=3
# auto-max-letters=24

# Also correct two-key words from the built-in closed lists.
# auto-short-words=true

# Detector thresholds: required score margin (0..5) and the largest cost of
# the alternative word (3..25.5). Higher margin = fewer, safer corrections.
# auto-margin=1.0
# auto-max-alt-cost=7.0

# Quiet time after Space before a correction is typed (30..1000 ms) and the
# minimum time between two corrections (0..10000 ms).
# auto-holdoff-ms=120
# auto-min-interval-ms=1000

# Replay timing: delay per typed event (0..200 ms) and pause after the layout
# switch (0..2000 ms); 0 uses delay / layout-switch-delay of default.conf.
# auto-delay-ms=3
# auto-switch-delay-ms=60

# Converting the word back (double Shift right after a correction) adds it to
# exceptions-words.txt after this many undos (1..10).
# auto-learn-on-undo=true
# auto-learn-undo-count=1

# Focus rules (need the gswitch-focus GNOME Shell extension). When
# auto-require-focus is true, nothing is corrected while the extension is
# absent.
# auto-require-focus=false
# auto-skip-password=true
# auto-skip-terminal=true
# auto-skip-locked=true

# Hotkeys: evdev scancodes joined with '+', or none. 2..4 keys, at least one
# modifier (29 LCtrl, 42 LShift, 54 RShift, 56 LAlt, 97 RCtrl, 100 RAlt,
# 125/126 Super); other keys only F1-F24, ScrollLock, Pause, Menu.
# hotkey-toggle-auto=42+54
# hotkey-convert-selection=42+97+100

# Publish corrected and learned words on the session bus (for the tray).
# With false, learned words stay in daemon memory only.
# ipc-expose-words=true

# Sources (applied at the next daemon start): focus-source auto|off,
# layout-source auto|ibus|none, and the layout hint window (100..2000 ms).
# focus-source=auto
# layout-source=auto
# layout-hint-timeout-ms=400
