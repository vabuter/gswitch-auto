# Release workflow for gswitch-auto (fork of gswitch)
# Triggered by pushing a fork tag v<upstream>+auto.<N> (e.g. v0.8.0+auto.1).
# Builds the RPM with scripts/build-rpm.sh (tests and RPM assertions included)
# and the Debian 12 package with scripts/build-deb.sh in the
# golang:1.26-bookworm image (SPEC-X11 §3.8.5), in parallel. Only when both
# packages were built and passed their checks does the publish job create the
# GitHub release, with both packages, both checksum files and the complete
# install notes in one step: a failing deb check never leaves a published
# RPM-only release behind for the tag.
# Uses only the automatic GITHUB_TOKEN; no repository secrets. Upstream's OBS
# job is not part of the fork (obs.yml stays guarded to arumata/gswitch).

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build RPM
    # "+" is a glob repeat operator in tag filters, so select fork tags here.
    if: contains(github.ref_name, '+auto.')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      base: ${{ steps.version.outputs.base }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cpio \
            libgtk-3-dev \
            libxkbcommon-dev \
            libx11-dev \
            rpm \
            rpm2cpio

      # Lets build-rpm.sh compare the packaged unit with upstream's tag.
      - name: Fetch upstream release tags
        run: |
          if ! git describe --tags --abbrev=0 --match 'v[0-9]*' \
              --exclude '*+*' --exclude '*-*' HEAD >/dev/null 2>&1; then
            git fetch --no-tags https://github.com/arumata/gswitch.git 'refs/tags/v*:refs/tags/v*'
          fi

      - name: Determine version
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          computed=$(scripts/version.sh)
          if [ "$computed" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match scripts/version.sh ($computed)" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "base=$(scripts/version.sh --base)" >>"$GITHUB_OUTPUT"

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0

      - name: Build RPM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build-rpm.sh --version "$VERSION" --release 1 --out dist

      - name: List release artifacts
        run: |
          ls -lh dist/
          cat dist/checksums.txt

      - name: Upload RPM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm
          path: |
            dist/*.rpm
            dist/checksums.txt
          if-no-files-found: error

  # Same image as `make deb` (packaging/debian12.Containerfile): Debian 12 has
  # no Go 1.25+, and the binaries must link against the bookworm userland.
  deb:
    name: Build Debian package (bookworm)
    if: contains(github.ref_name, '+auto.')
    runs-on: ubuntu-24.04
    container: docker.io/library/golang:1.26-bookworm
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      # Same package list as packaging/debian12.Containerfile; git before the
      # checkout, which otherwise downloads a tarball without tags.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            gcc libc6-dev pkg-config libgtk-3-dev libx11-dev libxkbcommon-dev \
            dpkg-dev fakeroot lintian python3 git ca-certificates xvfb x11-xkb-utils

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Root in the container, workspace owned by the runner user: mark it
      # safe, or git (and scripts/version.sh) refuses the repository.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0

      - name: Fetch upstream release tags
        run: |
          if ! git describe --tags --abbrev=0 --match 'v[0-9]*' \
              --exclude '*+*' --exclude '*-*' HEAD >/dev/null 2>&1; then
            git fetch --no-tags https://github.com/arumata/gswitch.git 'refs/tags/v*:refs/tags/v*'
          fi

      - name: Determine version
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          computed=$(scripts/version.sh)
          if [ "$computed" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match scripts/version.sh ($computed)" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      # The tests run in the release job (scripts/build-rpm.sh) for this
      # commit; this job runs as root, where the tests that expect permission
      # errors do not hold. It checks the package (dpkg-deb assertions,
      # lintian errors); the publish job needs both jobs.
      - name: Build .deb
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build-deb.sh --no-container --skip-tests --version "$VERSION" --revision 1 --out dist

      - name: Upload .deb artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: |
            dist/*.deb
            dist/checksums-deb.txt
          if-no-files-found: error

  # `gh` is on the ubuntu runner, not in the golang image. Nothing is
  # published before both packages were built and checked: the release is
  # created once, with every asset and the complete notes.
  publish:
    name: Publish GitHub release
    needs: [release, deb]
    runs-on: ubuntu-24.04

    steps:
      - name: Download RPM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rpm
          path: dist

      - name: Download .deb artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          BASE: ${{ needs.release.outputs.base }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c checksums.txt && sha256sum -c checksums-deb.txt)
          rpm_name="gswitch-auto-$VERSION-1.x86_64.rpm"
          deb_name="gswitch-auto_$VERSION-1_amd64.deb"
          test -f "dist/$rpm_name"
          test -f "dist/$deb_name"
          {
            echo "gswitch-auto $VERSION: fork of [gswitch](https://github.com/arumata/gswitch) v$BASE with automatic us/ru correction for GNOME (Wayland + IBus on Fedora, X11 on Debian 12)."
            echo ""
            echo "Install on Fedora (replaces the upstream gswitch package):"
            echo ""
            echo '```bash'
            echo "sha256sum -c checksums.txt"
            echo "sudo dnf install ./$rpm_name"
            echo "systemctl --user enable --now gswitch.service"
            echo '```'
            echo ""
            echo "Then log out and back in once for the GNOME Shell extension."
            echo ""
            echo "Install on Debian 12, GNOME on Xorg (replaces the upstream gswitch package):"
            echo ""
            echo '```bash'
            echo "sha256sum -c checksums-deb.txt"
            echo "sudo apt install ./$deb_name"
            echo "systemctl --user enable --now gswitch.service"
            echo '```'
            echo ""
            echo "Then log out and back in once (or Alt+F2, r) for the GNOME Shell extension. See README.md and docs/FORK.md."
          } >notes.md
          gh release create "$GITHUB_REF_NAME" \
            "dist/$rpm_name" dist/checksums.txt "dist/$deb_name" dist/checksums-deb.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "gswitch-auto $VERSION" \
            --notes-file notes.md \
            --verify-tag
          ls -lh dist/
