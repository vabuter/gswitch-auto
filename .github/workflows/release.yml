# Release workflow for gswitch-auto (fork of gswitch)
# Triggered by pushing a fork tag v<upstream>+auto.<N> (e.g. v0.8.0+auto.1).
# Builds the RPM with scripts/build-rpm.sh (tests and RPM assertions included)
# and publishes it with checksums.txt as a GitHub release; then builds the
# Debian 12 package with scripts/build-deb.sh in the golang:1.26-bookworm image
# and uploads it with checksums-deb.txt to the same release (SPEC-X11 §3.8.5).
# Uses only the automatic GITHUB_TOKEN; no repository secrets. Upstream's OBS
# job is not part of the fork (obs.yml stays guarded to arumata/gswitch).

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # "+" is a glob repeat operator in tag filters, so select fork tags here.
    if: contains(github.ref_name, '+auto.')
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cpio \
            libgtk-3-dev \
            libxkbcommon-dev \
            libx11-dev \
            rpm \
            rpm2cpio

      # Lets build-rpm.sh compare the packaged unit with upstream's tag.
      - name: Fetch upstream release tags
        run: |
          if ! git describe --tags --abbrev=0 --match 'v[0-9]*' \
              --exclude '*+*' --exclude '*-*' HEAD >/dev/null 2>&1; then
            git fetch --no-tags https://github.com/arumata/gswitch.git 'refs/tags/v*:refs/tags/v*'
          fi

      - name: Determine version
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          computed=$(scripts/version.sh)
          if [ "$computed" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match scripts/version.sh ($computed)" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0

      - name: Build RPM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build-rpm.sh --version "$VERSION" --release 1 --out dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          base=$(scripts/version.sh --base)
          rpm_name="gswitch-auto-$VERSION-1.x86_64.rpm"
          {
            echo "gswitch-auto $VERSION: fork of [gswitch](https://github.com/arumata/gswitch) v$base with automatic us/ru correction for GNOME Wayland + IBus."
            echo ""
            echo "Install on Fedora (replaces the upstream gswitch package):"
            echo ""
            echo '```bash'
            echo "sha256sum -c checksums.txt"
            echo "sudo dnf install ./$rpm_name"
            echo "systemctl --user enable --now gswitch.service"
            echo '```'
            echo ""
            echo "Then log out and back in once for the GNOME Shell extension. See README.md and docs/FORK.md."
          } >notes.md
          gh release create "$GITHUB_REF_NAME" "dist/$rpm_name" dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "gswitch-auto $VERSION" \
            --notes-file notes.md \
            --verify-tag

      - name: List release artifacts
        run: |
          ls -lh dist/
          cat dist/checksums.txt

  # Same image as `make deb` (packaging/debian12.Containerfile): Debian 12 has
  # no Go 1.25+, and the binaries must link against the bookworm userland.
  deb:
    name: Build Debian package (bookworm)
    needs: release
    if: contains(github.ref_name, '+auto.')
    runs-on: ubuntu-24.04
    container: docker.io/library/golang:1.26-bookworm

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            gcc libc6-dev pkg-config libgtk-3-dev libx11-dev libxkbcommon-dev \
            dpkg-dev fakeroot lintian python3 git ca-certificates xvfb x11-xkb-utils

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0

      - name: Fetch upstream release tags
        run: |
          if ! git describe --tags --abbrev=0 --match 'v[0-9]*' \
              --exclude '*+*' --exclude '*-*' HEAD >/dev/null 2>&1; then
            git fetch --no-tags https://github.com/arumata/gswitch.git 'refs/tags/v*:refs/tags/v*'
          fi

      - name: Determine version
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          computed=$(scripts/version.sh)
          if [ "$computed" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match scripts/version.sh ($computed)" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Build .deb
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build-deb.sh --no-container --version "$VERSION" --revision 1 --out dist

      - name: Upload .deb artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: |
            dist/*.deb
            dist/checksums-deb.txt
          if-no-files-found: error

  # `gh` is on the ubuntu runner, not in the golang image: attach the
  # package to the release created by the rpm job from here.
  publish-deb:
    name: Attach Debian package to the release
    needs: deb
    runs-on: ubuntu-24.04

    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
          path: dist

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c checksums-deb.txt)
          gh release upload "$GITHUB_REF_NAME" dist/gswitch-auto_*.deb dist/checksums-deb.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          ls -lh dist/
          cat dist/checksums-deb.txt
