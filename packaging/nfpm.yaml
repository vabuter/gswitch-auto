# nFPM configuration for the gswitch-auto packages (fork of gswitch).
#
# Single source of packaging metadata: upstream's .goreleaser.yml was removed
# and its nfpms section is mirrored here (see docs/FORK.md). Two packagers
# share it:
#
#   rpm  scripts/build-rpm.sh (`make rpm`), Fedora
#   deb  scripts/build-deb.sh (`make deb`), Debian 12 (SPEC-X11 §3.8)
#
# Both export GSWITCH_VERSION (e.g. 0.8.0+auto.1, scripts/version.sh) and
# GSWITCH_RELEASE (e.g. 1; the Debian revision for deb) and run nfpm from the
# repository root (src paths are relative to it). Binaries are built by the
# same scripts before packaging: into builds/ for the RPM and into
# builds/deb/ for the deb (Debian 12 userland, never over the host binaries).
# Entries with `packager: rpm` or `packager: deb` belong to one package only;
# the build scripts' preflight checks the sources of their own packager.
#
# Manual run:
#   GSWITCH_VERSION=0.8.0+auto.1 GSWITCH_RELEASE=1 \
#     nfpm package --config packaging/nfpm.yaml --packager rpm --target dist/

name: gswitch-auto
arch: amd64
platform: linux
version: ${GSWITCH_VERSION}
# Keep "+auto.N" verbatim: the semver schema would split it into metadata.
version_schema: none
release: ${GSWITCH_RELEASE}
# Safety net for any mode taken from the checkout. umask only removes bits,
# so every packaged file and directory also sets an explicit mode.
umask: 0022

section: utils
priority: optional
vendor: gswitch-auto
homepage: https://github.com/vabuter/gswitch-auto
# "Name <address>": lintian rejects anything else in the deb's Maintainer
# field (maintainer-address-malformed is an error); the RPM's Packager tag
# carries the same value.
maintainer: Vasily Buter <vasily.buter@gmail.com>
license: MIT AND BSD-3-Clause-Modification AND LicenseRef-Fedora-Public-Domain
description: |
  Keyboard layout switcher with text correction for Linux (fork of gswitch).
  Corrects text typed in the wrong keyboard layout. Manual correction works
  exactly as in upstream gswitch (double Shift and the other gestures). The
  fork adds automatic correction of the last word for the us/ru layout pair
  on GNOME (Wayland with IBus, or X11), triggered by Space and toggled with
  LShift+RShift (off by default), exception lists and a GNOME Shell
  extension that reports the focused application for exclusions.
  Includes the system tray application.

# Replaces the upstream package in place: same binary names and file paths.
# RPM Obsoletes + Provides perform the replacement; there is deliberately no
# Conflicts entry (an unversioned "Conflicts: gswitch" would match our own
# Provides, rpmlint self-conflict). Bump the Obsoletes bound when rebasing
# onto an upstream release >= the bound (docs/FORK.md, scripts/version.sh
# --verify checks it).
provides:
  - gswitch = ${GSWITCH_VERSION}-${GSWITCH_RELEASE}
replaces:
  - gswitch < 0.9

depends:
  - systemd
  - gtk3
recommends:
  - desktop-file-utils
  - wl-clipboard
suggests:
  - gnome-shell-extension-appindicator

rpm:
  group: Applications/System
  summary: Keyboard layout corrector with automatic us/ru mode (gswitch fork)
  scripts:
    # Hand the user unit's enablement over across the Obsoletes erase of the
    # upstream package (upstream preremove.sh disables it with $1=0).
    pretrans: scripts/pretrans.sh
    posttrans: scripts/posttrans.sh

# Upstream maintainer scripts, unchanged (modprobe uinput, udev reload and
# trigger, per-user daemon-reload/restart, icon cache, desktop database).
scripts:
  preinstall: scripts/preinstall.sh
  postinstall: scripts/postinstall.sh
  preremove: scripts/preremove.sh
  postremove: scripts/postremove.sh

# Debian 12 package (SPEC-X11 §3.8.1). On deb the replacement of the upstream
# package is Conflicts + Replaces + Provides: dpkg removes `gswitch` in favour
# of us, and a package may conflict with a virtual package it provides
# (Debian Policy 7.4). The upstream prerm runs before our preinst (no
# pretrans on deb), so scripts/deb/{preinst,postinst}.sh carry the unit
# enablement over with a marker; preremove/postremove stay upstream's,
# inherited from the top-level scripts block.
overrides:
  deb:
    depends:
      # libc6: nfpm adds no shlib dependencies; without it lintian reports
      # missing-dependency-on-libc (error). 2.34 is the highest GLIBC_
      # version the Go/CGO binaries reference; bookworm has 2.36.
      - libc6 (>= 2.34)
      - systemd
      - libgtk-3-0
      - libx11-6
      - libglib2.0-bin
      - policykit-1
      - x11-xkb-utils
    recommends:
      - libgtk-3-bin
      - desktop-file-utils
      - gnome-shell-extension-appindicator
      - ibus
      - wl-clipboard
    # nfpm merges overrides field by field and never replaces a list with an
    # empty one, so without this the RPM's Suggests entry would leak into the
    # deb and duplicate the Recommends above. The Extensions app toggles the
    # focus extension without the tray.
    suggests:
      - gnome-shell-extension-prefs
    provides:
      - gswitch (= ${GSWITCH_VERSION}-${GSWITCH_RELEASE})
    replaces:
      - gswitch
    conflicts:
      - gswitch
    scripts:
      preinstall: scripts/deb/preinst.sh
      postinstall: scripts/deb/postinst.sh

contents:
  # --- binaries (goreleaser added these via builds/bindir; listed explicitly) ---
  - src: builds/gswitch
    dst: /usr/bin/gswitch
    packager: rpm
    file_info:
      mode: 0755
  - src: builds/gswitch-tray
    dst: /usr/bin/gswitch-tray
    packager: rpm
    file_info:
      mode: 0755
  - src: builds/deb/gswitch
    dst: /usr/bin/gswitch
    packager: deb
    file_info:
      mode: 0755
  - src: builds/deb/gswitch-tray
    dst: /usr/bin/gswitch-tray
    packager: deb
    file_info:
      mode: 0755

  # --- gswitch daemon files (as upstream .goreleaser.yml) ---
  - dst: /etc/gswitch
    type: dir
    file_info:
      mode: 0755

  # Systemd user service unit, byte-identical to upstream (SPEC D2)
  - src: configs/gswitch.service
    dst: /usr/lib/systemd/user/gswitch.service
    file_info:
      mode: 0644

  # Udev rules for /dev/uinput and keyboard access (uaccess)
  - src: configs/70-gswitch.rules
    dst: /usr/lib/udev/rules.d/70-gswitch.rules
    file_info:
      mode: 0644

  # Default configuration file (preserved on upgrade)
  - src: configs/default.conf
    dst: /etc/gswitch/default.conf
    type: config
    packager: deb
    file_info:
      mode: 0644
  - src: configs/default.conf
    dst: /etc/gswitch/default.conf
    type: config|noreplace
    packager: rpm
    file_info:
      mode: 0644

  # --- gswitch-tray files ---
  # The autostart entries live under /etc: plain files for the RPM (as
  # upstream), conffiles for the deb (lintian: file-in-etc-not-marked-as-conffile
  # is an error).
  - src: configs/gswitch-tray.desktop
    dst: /etc/xdg/autostart/gswitch-tray.desktop
    packager: rpm
    file_info:
      mode: 0644
  - src: configs/gswitch-tray.desktop
    dst: /etc/xdg/autostart/gswitch-tray.desktop
    type: config
    packager: deb
    file_info:
      mode: 0644
  - src: configs/gswitch-daemon.desktop
    dst: /etc/xdg/autostart/gswitch-daemon.desktop
    packager: rpm
    file_info:
      mode: 0644
  - src: configs/gswitch-daemon.desktop
    dst: /etc/xdg/autostart/gswitch-daemon.desktop
    type: config
    packager: deb
    file_info:
      mode: 0644
  - src: configs/gswitch-tray.desktop
    dst: /usr/share/applications/gswitch-tray.desktop
    file_info:
      mode: 0644

  # Polkit policy for the tray's --write-config
  - src: configs/com.github.arumata.gswitch.policy
    dst: /usr/share/polkit-1/actions/com.github.arumata.gswitch.policy
    file_info:
      mode: 0644

  # Icons
  - src: assets/icons/hicolor/16x16/apps/gswitch.png
    dst: /usr/share/icons/hicolor/16x16/apps/gswitch.png
    file_info:
      mode: 0644
  - src: assets/icons/hicolor/22x22/apps/gswitch.png
    dst: /usr/share/icons/hicolor/22x22/apps/gswitch.png
    file_info:
      mode: 0644
  - src: assets/icons/hicolor/24x24/apps/gswitch.png
    dst: /usr/share/icons/hicolor/24x24/apps/gswitch.png
    file_info:
      mode: 0644
  - src: assets/icons/hicolor/32x32/apps/gswitch.png
    dst: /usr/share/icons/hicolor/32x32/apps/gswitch.png
    file_info:
      mode: 0644
  - src: assets/icons/hicolor/48x48/apps/gswitch.png
    dst: /usr/share/icons/hicolor/48x48/apps/gswitch.png
    file_info:
      mode: 0644
  - src: assets/icons/hicolor/64x64/apps/gswitch.png
    dst: /usr/share/icons/hicolor/64x64/apps/gswitch.png
    file_info:
      mode: 0644
  - src: assets/icons/hicolor/128x128/apps/gswitch.png
    dst: /usr/share/icons/hicolor/128x128/apps/gswitch.png
    file_info:
      mode: 0644
  - src: assets/icons/hicolor/256x256/apps/gswitch.png
    dst: /usr/share/icons/hicolor/256x256/apps/gswitch.png
    file_info:
      mode: 0644
  - src: assets/icons/hicolor/scalable/apps/gswitch.svg
    dst: /usr/share/icons/hicolor/scalable/apps/gswitch.svg
    file_info:
      mode: 0644

  # --- fork additions ---

  # GNOME Shell extension reporting the focused application (SPEC §3.5).
  # UUID == directory name == focus.ExtensionUUID (scripts/check-extension.sh).
  # Listed file by file with explicit modes: a tree would take its modes from
  # the checkout (a builder umask of 077 ships 0700/0600, which gnome-shell
  # running as the user cannot read, and umask never adds bits) and would
  # ship stray files such as editor swap files. scripts/check-extension.sh
  # checks that every extension file is listed here.
  #
  # Two trees with the same UUID and D-Bus interface (SPEC-X11 §3.6): the ESM
  # variant for GNOME >= 45 goes into the RPM (Fedora), the legacy GJS variant
  # under shell-extension/legacy/ for GNOME 43/44 goes into the deb (Debian 12).
  - dst: /usr/share/gnome-shell/extensions/gswitch-focus@vabuter.github.io
    type: dir
    file_info:
      mode: 0755
  - src: shell-extension/gswitch-focus@vabuter.github.io/metadata.json
    dst: /usr/share/gnome-shell/extensions/gswitch-focus@vabuter.github.io/metadata.json
    packager: rpm
    file_info:
      mode: 0644
  - src: shell-extension/gswitch-focus@vabuter.github.io/extension.js
    dst: /usr/share/gnome-shell/extensions/gswitch-focus@vabuter.github.io/extension.js
    packager: rpm
    file_info:
      mode: 0644
  - src: shell-extension/legacy/gswitch-focus@vabuter.github.io/metadata.json
    dst: /usr/share/gnome-shell/extensions/gswitch-focus@vabuter.github.io/metadata.json
    packager: deb
    file_info:
      mode: 0644
  - src: shell-extension/legacy/gswitch-focus@vabuter.github.io/extension.js
    dst: /usr/share/gnome-shell/extensions/gswitch-focus@vabuter.github.io/extension.js
    packager: deb
    file_info:
      mode: 0644

  # Licences: the fork, the embedded punto-rs models (hunspell-ru derivative,
  # see THIRD-PARTY-NOTICES.md) and the vendored clipboard package.
  # RPM: %license files under /usr/share/licenses (the license/doc types are
  # RPM-only and skipped by nfpm for other packagers anyway).
  - src: LICENSE
    dst: /usr/share/licenses/gswitch-auto/LICENSE
    type: license
    packager: rpm
    file_info:
      mode: 0644
  - src: third_party/punto-rs/LICENSE
    dst: /usr/share/licenses/gswitch-auto/punto-rs-LICENSE
    type: license
    packager: rpm
    file_info:
      mode: 0644
  - src: third_party/punto-rs/hunspell-ru-LICENSE
    dst: /usr/share/licenses/gswitch-auto/hunspell-ru-LICENSE
    type: license
    packager: rpm
    file_info:
      mode: 0644
  - src: third_party/punto-rs/NOTICE.md
    dst: /usr/share/licenses/gswitch-auto/THIRD-PARTY-NOTICES.md
    type: license
    packager: rpm
    file_info:
      mode: 0644
  - src: third_party/clipboard/LICENSE
    dst: /usr/share/licenses/gswitch-auto/clipboard-LICENSE
    type: license
    packager: rpm
    file_info:
      mode: 0644

  - src: README.md
    dst: /usr/share/doc/gswitch-auto/README.md
    type: doc
    packager: rpm
    file_info:
      mode: 0644

  # Deb: the machine-readable copyright file (DEP-5, required by Policy 12.5)
  # plus the same licence texts and README as plain files under
  # /usr/share/doc (no /usr/share/licenses on Debian).
  - src: packaging/debian/copyright
    dst: /usr/share/doc/gswitch-auto/copyright
    packager: deb
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/gswitch-auto/LICENSE
    packager: deb
    file_info:
      mode: 0644
  - src: third_party/punto-rs/LICENSE
    dst: /usr/share/doc/gswitch-auto/punto-rs-LICENSE
    packager: deb
    file_info:
      mode: 0644
  - src: third_party/punto-rs/hunspell-ru-LICENSE
    dst: /usr/share/doc/gswitch-auto/hunspell-ru-LICENSE
    packager: deb
    file_info:
      mode: 0644
  - src: third_party/punto-rs/NOTICE.md
    dst: /usr/share/doc/gswitch-auto/THIRD-PARTY-NOTICES.md
    packager: deb
    file_info:
      mode: 0644
  - src: third_party/clipboard/LICENSE
    dst: /usr/share/doc/gswitch-auto/clipboard-LICENSE
    packager: deb
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/gswitch-auto/README.md
    packager: deb
    file_info:
      mode: 0644

  # Own the package's documentation and licence directories.
  - dst: /usr/share/licenses/gswitch-auto
    type: dir
    packager: rpm
    file_info:
      mode: 0755
  - dst: /usr/share/doc/gswitch-auto
    type: dir
    file_info:
      mode: 0755
